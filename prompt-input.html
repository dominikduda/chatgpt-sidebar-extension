<!DOCTYPE html>
<!--
  ChatGPT Sidebar - Custom Prompt Input
  
  Popup dialog for entering custom prompts when using
  "Custom prompt..." from the context menu.
  
  @author toastyfawn566
  @version 1.3.0
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Prompt</title>
  <style>
    /* ==========================================================================
       RESET & BASE
       ========================================================================== */
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #242424;
      color: #e5e5e5;
      padding: 20px;
      min-width: 400px;
    }
    
    /* ==========================================================================
       TYPOGRAPHY
       ========================================================================== */
    
    h2 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 16px;
    }
    
    /* ==========================================================================
       PAGE INFO DISPLAY
       ========================================================================== */
    
    .page-info {
      background: #1a1a1a;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    
    .page-info .label {
      color: #888;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    
    .page-info .title {
      color: #fff;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .page-info .url {
      color: #10a37f;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 4px;
    }
    
    /* ==========================================================================
       FORM ELEMENTS
       ========================================================================== */
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      font-size: 13px;
      color: #ccc;
      margin-bottom: 8px;
    }
    
    .form-group textarea {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px;
      font-size: 14px;
      color: #e5e5e5;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
    
    .form-group textarea:focus {
      outline: none;
      border-color: #10a37f;
    }
    
    .hint {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
    }
    
    .hint code {
      background: #333;
      padding: 1px 4px;
      border-radius: 3px;
      color: #10a37f;
    }
    
    /* ==========================================================================
       BUTTONS
       ========================================================================== */
    
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    
    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #10a37f;
      color: white;
    }
    
    .btn-primary:hover {
      background: #0d8a6a;
    }
    
    .btn-secondary {
      background: #333;
      color: #e5e5e5;
    }
    
    .btn-secondary:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <h2>Custom Prompt</h2>
  
  <!-- Current page info display -->
  <div class="page-info">
    <div class="label">Current Page</div>
    <div class="title" id="page-title">Loading...</div>
    <div class="url" id="page-url"></div>
  </div>
  
  <!-- Prompt input -->
  <div class="form-group">
    <label for="custom-prompt">Your prompt:</label>
    <textarea id="custom-prompt" placeholder="Type your question or instruction for ChatGPT..."></textarea>
    <div class="hint">
      The page title and URL will be appended automatically, or use <code>{title}</code> and <code>{url}</code> placeholders.
    </div>
  </div>
  
  <!-- Action buttons -->
  <div class="actions">
    <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
    <button class="btn btn-primary" id="send-btn">Send to ChatGPT</button>
  </div>
  
  <script src="prompt-input.js"></script>
</body>
</html>
